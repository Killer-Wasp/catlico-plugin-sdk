[project]
name = "catlico-defang-annotator-plugin"
version = "0.1.0"
description = "Defang IP/domain/URL observables for safe reporting; flags private IP ranges. Fully offline — no vendor calls."
requires-python = ">=3.14"
dependencies = [
    "catlico-plugin-sdk",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defang_annotator_plugin"]

# This example ships *inside* the SDK repo itself (catlico-plugin-sdk/examples/<name>/),
# two directories below the repo root — unlike a real plugin repo, where the SDK sits
# beside `catlico-plugins/` and the scaffold's default `../../catlico-plugin-sdk` applies.
# Here `../..` from this file lands directly on the SDK repo root (this repo), so the
# path is `../..`, not `../../catlico-plugin-sdk`.
[tool.uv.sources]
catlico-plugin-sdk = { path = "../.." }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
