[project]
name = "catlico-plugin-sdk"
version = "0.1.0"
description = "Plugin SDK for catlico-plugin-runner: the Plugin base class, event models, and runtime context."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11",
    "httpx>=0.27",
]

[project.scripts]
catlico-plugin = "catlico_plugin_sdk.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catlico_plugin_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
